name: Watch mod feedback

# GitHub can't schedule runs more often than every 5 minutes (and often runs them late),
# so one run stays alive for a "shift" of almost 6 hours, checks every minute, and then
# starts the next shift itself. The cron below is only a watchdog that restarts the chain
# if it ever breaks (GitHub outage, manual cancel, ...).

on:
  push:
    paths:
      - "bot.py"
      - "projects.json"
      - "requirements.txt"
      - "presence.py"
      - ".github/workflows/watch.yml"
  schedule:
    - cron: "*/30 * * * *"   # watchdog only: does nothing while a shift is running
  workflow_dispatch:          # lets you start it manually from the Actions tab

permissions:
  contents: write             # needed to save state.json (what was already posted)
  actions: write              # needed to start the next shift

env:
  CHECK_EVERY_SECONDS: 60
  SHIFT_MINUTES: 340          # GitHub kills jobs after 6 h; leave room for setup and hand-off

jobs:
  gate:
    # Runs outside the concurrency group, so a watchdog tick can see a shift is
    # already running and finish in seconds instead of queueing behind it.
    runs-on: ubuntu-latest
    outputs:
      busy: ${{ steps.check.outputs.busy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow watch.yml --limit 20 \
            --json databaseId,status \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          echo "busy=$busy" >> "$GITHUB_OUTPUT"

  watch:
    needs: gate
    # Pushes and hand-offs always run (they queue behind the current shift);
    # watchdog ticks only start a shift when none is alive.
    if: github.event_name != 'schedule' || needs.gate.outputs.busy == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: watch
      # A push replaces the running shift so new code takes effect right away.
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check GitHub issues and CurseForge comments every minute
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CATEGORY_NAME: Feedback Watcher
          ISSUES_FORUM_ID: ${{ secrets.ISSUES_FORUM_ID }}
          ON_CLOSE: archive      # what to do when an issue is closed on GitHub: archive | mark | delete
          GITHUB_WEBHOOK_URL: ${{ secrets.ISSUES_WEBHOOK }}   # optional fallback, not needed with the bot
          CURSEFORGE_WEBHOOK_URL: ${{ secrets.COMMENTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          HEADLESS: "false"      # real (virtual-screen) browser passes Cloudflare more often
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The checkout is the commit that triggered this run, which can be older than the
          # state the previous shift pushed while this run was queued. Start from the newest.
          git pull -q --rebase

          # Saved after every check that delivered something, so a cancelled shift never re-posts.
          save_state() {
            git add state.json
            # Only "checked until" timestamps moved: not worth a commit, since the
            # delivered-ID lists already stop a later shift from posting anything twice.
            if ! git diff --cached -U0 state.json | grep '^[-+] ' | grep -qvE '"(gh_since|heartbeat)":'; then
              return 0
            fi
            git commit -q -m "update state"
            # Only one shift runs at a time, so its state wins any conflict (-X theirs keeps
            # the local commit during a rebase). Never leave a half-done rebase behind: its
            # conflict markers would make state.json unreadable for the next check.
            if ! { git pull -q --rebase --autostash -X theirs && git push -q; }; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::could not push state.json, retrying next check"
            fi
          }

          # Shows the bot as online for exactly as long as this shift is checking.
          python presence.py &
          presence_pid=$!
          trap 'kill -INT "$presence_pid" 2>/dev/null; wait "$presence_pid" 2>/dev/null || true' EXIT

          shift_end=$(( $(date +%s) + SHIFT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$shift_end" ]; do
            started=$(date +%s)
            xvfb-run -a python bot.py --once || echo "::warning::check failed, trying again next minute"
            save_state
            wait=$(( started + CHECK_EVERY_SECONDS - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done

      - name: Start the next shift
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
