name: Watch mod feedback

on:
  push:
    paths:
      - "bot.py"
      - "projects.json"
      - "requirements.txt"
      - ".github/workflows/watch.yml"
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay it a few minutes)
  workflow_dispatch:          # lets you start it manually from the Actions tab

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write             # needed to save state.json (what was already posted)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check GitHub issues and CurseForge comments
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CATEGORY_NAME: Feedback Watcher
          ISSUES_FORUM_ID: ${{ secrets.ISSUES_FORUM_ID }}
          ON_CLOSE: archive      # what to do when an issue is closed on GitHub: archive | mark | delete
          GITHUB_WEBHOOK_URL: ${{ secrets.ISSUES_WEBHOOK }}   # optional fallback, not needed with the bot
          CURSEFORGE_WEBHOOK_URL: ${{ secrets.COMMENTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          HEADLESS: "false"      # real (virtual-screen) browser passes Cloudflare more often
        run: xvfb-run -a python bot.py --once

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase
            git push
          fi

